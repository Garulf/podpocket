name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uvx --with tox-uv tox
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: podpocket:ci
      - name: Start the container
        run: docker run -d --name podpocket -p 8000:8000 -e PODPOCKET_PUBLIC_URL=http://localhost:8000 podpocket:ci
      - name: Wait for /health
        run: |
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs podpocket
          exit 1
